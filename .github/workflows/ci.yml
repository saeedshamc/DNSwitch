name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Test backend
        run: go test ./backend/...
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend lint
        working-directory: frontend
        run: |
          npm install
          npm run lint

  build-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install NSIS
        run: choco install nsis -y
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build
        run: wails build -platform windows/amd64 -nsis -clean
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/bin/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*.exe

  build-linux:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev gcc pkg-config
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build
        run: wails build -platform linux/amd64 -clean
      - name: Package tarball
        run: |
          chmod +x scripts/linux-appimage.sh
          tar -C build/bin -czf build/bin/DNSwitch-linux-amd64.tar.gz DNSwitch
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/bin/DNSwitch
            build/bin/DNSwitch-linux-amd64.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/DNSwitch
            build/bin/DNSwitch-linux-amd64.tar.gz
