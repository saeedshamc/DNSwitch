<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="DNSwitch">
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="220" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101828"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="orbit" x1="48" y1="56" x2="208" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="toggle" x1="128" y1="68" x2="128" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3FC"/>
      <stop offset="0.45" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="128" cy="128" r="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="86" fill="url(#glow)"/>

  <!-- Orbital arcs (DNS / network) -->
  <path d="M64 148c8-52 40-84 64-84s56 32 64 84" fill="none" stroke="url(#orbit)" stroke-width="11" stroke-linecap="round" opacity="0.95"/>
  <path d="M192 108c-8 52-40 84-64 84s-56-32-64-84" fill="none" stroke="url(#orbit)" stroke-width="11" stroke-linecap="round" opacity="0.7"/>

  <!-- Signal nodes -->
  <g fill="#E0F2FE" filter="url(#soft)">
    <circle cx="88" cy="86" r="6.5"/>
    <circle cx="168" cy="86" r="6.5"/>
    <circle cx="88" cy="170" r="6.5"/>
    <circle cx="168" cy="170" r="6.5"/>
  </g>

  <!-- Switch body -->
  <rect x="104" y="72" width="48" height="112" rx="24" fill="url(#toggle)"/>
  <rect x="110" y="78" width="36" height="40" rx="18" fill="#FFFFFF" opacity="0.18"/>

  <!-- Knob (on) -->
  <circle cx="128" cy="108" r="15" fill="#F8FAFC"/>
  <circle cx="128" cy="108" r="7" fill="#22D3EE" opacity="0.85"/>
</svg>
